<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#101116;
    --bg-elevated:#16171F;
    --bg-card:#1C1E27;
    --bg-card-hover:#20222D;
    --border:#2A2C37;
    --border-soft:#22232D;
    --text:#E9EAEF;
    --text-muted:#93949F;
    --text-dim:#5C5E6B;
    --obj:#4C8DFF;
    --obj-dim:rgba(76,141,255,0.10);
    --obj-line:rgba(76,141,255,0.35);
    --subj:#C77DFF;
    --subj-dim:rgba(199,125,255,0.10);
    --subj-line:rgba(199,125,255,0.35);
    --yes:#3ED68C;
    --yes-dim:rgba(62,214,140,0.12);
    --no:#FF6B6B;
    --no-dim:rgba(255,107,107,0.12);
    --radius:10px;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);height:100%;}
  #app{display:grid;grid-template-columns:272px 1fr;min-height:100vh;}
  ::selection{background:var(--obj-dim);}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--bg-elevated);
    border-right:1px solid var(--border-soft);
    padding:22px 18px;
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .brand{margin-bottom:26px;}
  .brand-mark{display:flex;align-items:center;gap:9px;margin-bottom:3px;}
  .brand-tick{width:16px;height:16px;border:2px solid var(--obj);border-radius:3px;position:relative;flex:none;}
  .brand-tick::after{content:"";position:absolute;left:2px;top:5px;width:8px;height:4px;border-left:2px solid var(--obj);border-bottom:2px solid var(--obj);transform:rotate(-45deg);}
  .brand-name{font-family:var(--font-display);font-weight:700;font-size:16.5px;letter-spacing:0.01em;}
  .brand-sub{font-size:11px;color:var(--text-dim);font-family:var(--font-mono);letter-spacing:0.04em;text-transform:uppercase;margin-left:25px;}

  .side-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;font-family:var(--font-mono);margin:18px 0 8px 4px;}
  .project-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;}
  .project-item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:9px 8px 9px 10px;border-radius:8px;font-size:13.5px;color:var(--text-muted);cursor:pointer;border:1px solid transparent;position:relative;}
  .project-item:hover{background:var(--bg-card);color:var(--text);}
  .project-item.active{background:var(--obj-dim);color:var(--text);border-color:var(--obj-line);}
  .project-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
  .project-rename-input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--obj-line);border-radius:6px;padding:4px 7px;color:var(--text);font-size:13px;}
  .project-kebab{flex:none;width:22px;height:22px;border-radius:6px;border:none;background:transparent;color:var(--text-dim);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .project-kebab:hover{background:rgba(255,255,255,0.08);color:var(--text);}
  .project-menu{position:absolute;top:calc(100% + 3px);right:6px;z-index:20;background:var(--bg-elevated);border:1px solid var(--border);border-radius:9px;box-shadow:0 10px 28px rgba(0,0,0,0.45);overflow:hidden;min-width:130px;}
  .project-menu button{display:block;width:100%;text-align:left;padding:9px 12px;background:none;border:none;color:var(--text-muted);font-size:12.5px;font-weight:500;}
  .project-menu button:hover{background:var(--bg-card);color:var(--text);}
  .project-menu button.danger:hover{color:var(--no);}
  .empty-sidebar{font-size:12.5px;color:var(--text-dim);padding:8px 4px;line-height:1.5;}

  .new-project{margin-top:14px;}
  .gh-connect{margin-top:8px;}
  #ghConnectStatus.connected{color:var(--yes);}
  #ghConnectStatus.disconnected{color:var(--no);}
  .new-project-form{display:none;gap:6px;margin-top:8px;}
  .new-project-form.open{display:flex;}
  .btn-add-project{width:100%;padding:8px 10px;border-radius:8px;border:1px dashed var(--border);background:none;color:var(--text-muted);font-size:13px;text-align:left;}
  .btn-add-project:hover{border-color:var(--obj-line);color:var(--text);}
  #newProjectInput{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;}

  /* ---------- Main ---------- */
  .main{padding:30px 40px 60px;max-width:960px;width:100%;}
  .no-project{margin-top:120px;text-align:center;color:var(--text-dim);}
  .no-project h2{font-family:var(--font-display);color:var(--text-muted);font-weight:600;}

  .main-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px;gap:20px;flex-wrap:wrap;}
  .project-title{font-family:var(--font-display);font-size:26px;font-weight:700;margin:0 0 4px;}
  .project-meta{font-size:12.5px;color:var(--text-dim);font-family:var(--font-mono);}

  .tabs{display:flex;gap:4px;background:var(--bg-elevated);padding:4px;border-radius:9px;border:1px solid var(--border-soft);}
  .tab-btn{padding:8px 16px;border-radius:6px;border:none;background:none;color:var(--text-muted);font-size:13px;font-weight:600;letter-spacing:0.01em;}
  .tab-btn.active{background:var(--bg-card);color:var(--text);}

  /* ---------- Form card ---------- */
  .card{background:var(--bg-card);border:1px solid var(--border-soft);border-radius:var(--radius);padding:26px 26px 24px;}
  .field{margin-bottom:20px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:7px;letter-spacing:0.01em;}
  .field .req{color:var(--no);margin-left:2px;}
  .field input[type=text]{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;}
  .field input[type=text]:focus{outline:none;border-color:var(--obj-line);}

  /* ---------- Category checklist ---------- */
  .checklist-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  .checklist-head label{font-size:12.5px;font-weight:600;color:var(--text-muted);letter-spacing:0.01em;}
  .checklist-progress{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);}
  .quick-actions{display:flex;gap:8px;margin-bottom:10px;}
  .quick-btn{padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text-dim);font-size:11.5px;font-weight:600;}
  .quick-btn:hover{color:var(--text);border-color:var(--text-dim);}

  .cat-list{border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .cat-row{border-bottom:1px solid var(--border-soft);background:var(--bg-card);}
  .cat-row:last-child{border-bottom:none;}
  .cat-row.flagged{background:linear-gradient(90deg, rgba(255,107,107,0.05), transparent 40%), var(--bg-card);}
  .cat-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;gap:12px;}
  .cat-name-wrap{display:flex;align-items:center;gap:9px;min-width:0;}
  .cat-status-dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex:none;}
  .cat-status-dot.yes{background:var(--yes);}
  .cat-status-dot.no{background:var(--no);}
  .cat-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cat-obj-only{font-size:10px;font-family:var(--font-mono);color:var(--text-dim);border:1px solid var(--border);border-radius:20px;padding:1px 7px;flex:none;text-transform:uppercase;letter-spacing:0.04em;}
  .cat-yn{display:flex;gap:6px;flex:none;}
  .cat-yn-btn{padding:6px 13px;border-radius:7px;border:1.5px solid var(--border);background:var(--bg);font-size:11.5px;font-weight:700;color:var(--text-muted);}
  .cat-yn-btn.yes.selected{border-color:var(--yes);background:var(--yes-dim);color:var(--text);}
  .cat-yn-btn.no.selected{border-color:var(--no);background:var(--no-dim);color:var(--text);}
  .cat-yn-btn:hover{color:var(--text);}

  .cat-detail{padding:2px 14px 16px;}
  .fb-tabs{display:flex;border-radius:9px;overflow:hidden;border:1px solid var(--border);}
  .fb-tab{flex:1;padding:9px 10px;background:var(--bg);border:none;font-size:11.5px;font-weight:700;font-family:var(--font-mono);letter-spacing:0.04em;text-transform:uppercase;color:var(--text-dim);border-bottom:2px solid transparent;}
  .fb-tab.obj-tab.active{color:var(--obj);background:var(--obj-dim);border-bottom-color:var(--obj);}
  .fb-tab.subj-tab.active{color:var(--subj);background:var(--subj-dim);border-bottom-color:var(--subj);}
  .fb-body{border:1px solid var(--border);border-top:none;border-radius:0 0 9px 9px;padding:14px;}
  .fb-body.obj-body{background:linear-gradient(var(--obj-dim),var(--obj-dim)),repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(76,141,255,0.07) 23px, rgba(76,141,255,0.07) 24px),repeating-linear-gradient(90deg, transparent, transparent 23px, rgba(76,141,255,0.07) 23px, rgba(76,141,255,0.07) 24px);}
  .fb-body.subj-body{background:radial-gradient(ellipse at 15% 20%, rgba(199,125,255,0.13), transparent 55%),radial-gradient(ellipse at 85% 75%, rgba(199,125,255,0.10), transparent 60%),var(--subj-dim);}
  .fb-hint{font-size:11.5px;line-height:1.5;margin:0 0 9px;color:var(--text-muted);}
  .fb-hint b{color:var(--text);}
  .fb-body textarea{width:100%;min-height:78px;resize:vertical;background:rgba(16,17,22,0.55);border:1px solid var(--border);border-radius:7px;padding:10px 11px;color:var(--text);font-size:13px;line-height:1.5;}
  .fb-body.obj-body textarea:focus{outline:none;border-color:var(--obj-line);}
  .fb-body.subj-body textarea:focus{outline:none;border-color:var(--subj-line);}
  .obj-only-body{border:1px solid var(--border);border-radius:9px;padding:14px;background:linear-gradient(var(--obj-dim),var(--obj-dim)),repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(76,141,255,0.07) 23px, rgba(76,141,255,0.07) 24px),repeating-linear-gradient(90deg, transparent, transparent 23px, rgba(76,141,255,0.07) 23px, rgba(76,141,255,0.07) 24px);}

  .submit-row{display:flex;align-items:center;gap:14px;margin-top:24px;}
  .btn-submit{padding:11px 22px;border-radius:8px;border:none;background:var(--text);color:var(--bg);font-weight:700;font-size:13.5px;letter-spacing:0.01em;}
  .btn-submit:disabled{background:var(--border);color:var(--text-dim);cursor:not-allowed;}
  .submit-note{font-size:12px;color:var(--text-dim);}
  .submit-confirm{font-size:12.5px;color:var(--yes);font-weight:600;}

  /* ---------- Dashboard ---------- */
  .kanban{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
  @media (max-width:720px){.kanban{grid-template-columns:1fr;}}
  .kanban-col{background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:12px;padding:14px;min-height:120px;transition:background .12s, border-color .12s;}
  .kanban-col.drag-over{border-color:var(--obj-line);background:var(--obj-dim);}
  .kanban-col-head{display:flex;align-items:center;gap:9px;padding:2px 4px 14px;}
  .kanban-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .kanban-dot.approved{background:var(--yes);}
  .kanban-dot.action{background:var(--no);}
  .kanban-title{font-family:var(--font-display);font-weight:700;font-size:14.5px;}
  .kanban-count{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);background:var(--bg);border-radius:20px;padding:2px 8px;margin-left:auto;}
  .kanban-empty{padding:22px 10px;text-align:center;color:var(--text-dim);font-size:12px;border:1px dashed var(--border);border-radius:9px;}
  .kanban-cards{display:flex;flex-direction:column;gap:9px;}
  .req-card{cursor:grab;}
  .req-card.dragging{opacity:0.4;}

  .req-list{display:flex;flex-direction:column;gap:10px;}
  .req-card{background:var(--bg-card);border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;}
  .req-row{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;}
  .req-row:hover{background:var(--bg-card-hover);}
  .badge{flex:none;font-family:var(--font-mono);font-size:10.5px;font-weight:700;letter-spacing:0.05em;padding:4px 9px;border-radius:20px;text-transform:uppercase;}
  .badge.yes,.badge.approved{background:var(--yes-dim);color:var(--yes);}
  .badge.no,.badge.action{background:var(--no-dim);color:var(--no);}
  .status-move-btn{flex:none;padding:5px 10px;border-radius:7px;border:1px solid var(--border);background:var(--bg);color:var(--text-dim);font-size:11px;font-weight:600;white-space:nowrap;}
  .status-move-btn:hover{color:var(--text);border-color:var(--text-dim);}
  .req-info{flex:1;min-width:0;}
  .req-title{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .req-sub{font-size:11.5px;color:var(--text-dim);font-family:var(--font-mono);margin-top:2px;}
  .chevron{flex:none;color:var(--text-dim);font-size:12px;transition:transform .15s;}
  .req-card.open .chevron{transform:rotate(90deg);}

  .req-detail{display:none;border-top:1px solid var(--border-soft);padding:16px 18px 20px;}
  .req-card.open .req-detail{display:block;}
  .flagged-cats{display:flex;flex-direction:column;gap:14px;}
  .flagged-cat-block{border:1px solid var(--border-soft);border-radius:9px;overflow:hidden;}
  .flagged-cat-title{padding:9px 13px;font-size:12.5px;font-weight:700;background:var(--bg-elevated);border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:8px;}
  .flagged-cat-title .cat-status-dot{background:var(--no);}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;}
  .detail-grid.single{grid-template-columns:1fr;}
  @media (max-width:640px){.detail-grid{grid-template-columns:1fr;}}
  .detail-panel{padding:12px 14px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;}
  .detail-panel.obj{background:var(--obj-dim);}
  .detail-panel.subj{background:var(--subj-dim);border-left:1px solid var(--border-soft);}
  .detail-panel-label{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px;display:block;}
  .detail-panel.obj .detail-panel-label{color:var(--obj);}
  .detail-panel.subj .detail-panel-label{color:var(--subj);}
  .all-clear{padding:14px;text-align:center;color:var(--text-dim);font-size:12.5px;}

  .empty-dash{padding:60px 20px;text-align:center;color:var(--text-dim);}
  .empty-dash h3{font-family:var(--font-display);color:var(--text-muted);margin-bottom:6px;}

  @media (max-width:800px){
    #app{grid-template-columns:1fr;}
    .sidebar{position:static;height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;padding:16px 18px;gap:10px;}
    .brand{margin-bottom:0;}
    .brand-sub{display:none;}
    .side-label{display:none;}
    .project-list{flex-direction:row;flex-wrap:wrap;overflow:visible;flex:none;width:100%;order:3;}
    .new-project{order:2;}
    .main{padding:24px 16px 50px;}
    .cat-head{flex-wrap:wrap;}
  }
</style>

<div id="app">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <div class="brand-tick"></div>
        <div class="brand-name">Frame Check</div>
      </div>
      <div class="brand-sub">Edit feedback log</div>
    </div>
    <div class="side-label">Projects</div>
    <ul class="project-list" id="projectList"></ul>
    <div class="new-project">
      <button class="btn-add-project" id="toggleNewProject">+ New project</button>
      <div class="new-project-form" id="newProjectForm">
        <input type="text" id="newProjectInput" placeholder="Project name" maxlength="60">

      </div>

    <div class="gh-connect">
      <span id="ghConnectStatus" class="connected" style="font-size:11.5px;color:var(--text-dim);">\u26a1 syncing via shared server</span>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>

<script>
// ============================================================
// SHARED-SERVER STORAGE CONFIG
// ============================================================
// Data is written to a GitHub repo, but through a small proxy server
// (a Cloudflare Worker) instead of the browser talking to GitHub directly.
// The GitHub token lives only on that server \u2014 nobody who opens this
// page needs a GitHub account or token. Anyone with the link can submit.
//
// This site writes to github.com/mattcash4567-droid/SURVEY_SITE_UPDATED
// via the worker. Fill in WORKER_URL with the URL you get after deploying
// worker.js (see the deployment instructions provided alongside this file).
const WORKER_URL = 'https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev';
// Optional shared passphrase, must match SHARED_SECRET set on the worker.
// Leave blank to skip this extra check.
const SURVEY_SECRET = '';

function storageHeaders(extra){
  const h = { 'Content-Type': 'application/json', ...(extra||{}) };
  if(SURVEY_SECRET) h['X-Survey-Secret'] = SURVEY_SECRET;
  return h;
}

async function storageGet(key){
  const res = await fetch(`${WORKER_URL}/?key=${encodeURIComponent(key)}`, { headers: storageHeaders() });
  if(!res.ok){ const err = await res.json().catch(()=>({})); throw new Error(err.error || ('Server read failed (' + res.status + ')')); }
  const data = await res.json();
  return data.content;
}
async function storageSet(key, value){
  const res = await fetch(`${WORKER_URL}/?key=${encodeURIComponent(key)}`, {
    method: 'POST', headers: storageHeaders(), body: JSON.stringify({ value })
  });
  if(!res.ok){ const err = await res.json().catch(()=>({})); throw new Error(err.error || ('Server write failed (' + res.status + ')')); }
}
async function storageDelete(key){
  const res = await fetch(`${WORKER_URL}/?key=${encodeURIComponent(key)}`, { method:'DELETE', headers: storageHeaders() });
  if(!res.ok){ const err = await res.json().catch(()=>({})); throw new Error(err.error || ('Server delete failed (' + res.status + ')')); }
}

    {id:'voiceover', name:'Voiceover', obj:"Mispronunciation, wrong script version read, timing doesn't match required duration", subj:"\u201cVO doesn't have the right energy\u201d"},
    {id:'thumbnail', name:'Thumbnail/Cover Frame', obj:"Doesn't meet platform spec (size/safe zone/text ratio), doesn't match approved brand template", subj:"\u201cPrefer a different frame\u201d"}
  ];

  function freshCatState(){
    const o = {};
    CATEGORIES.forEach(c => { o[c.id] = {yn:null, objective:'', subjective:'', fbTab:'objective', open:false}; });
    return o;
  }

  const state = {
    projects: [],
    currentProjectId: null,
    requests: [],
    view: 'submit',
    filter: 'all',
    openProjectMenuId: null,
    renamingProjectId: null,
    form: { reviewer:'', cats: freshCatState(), otherFeedback:'', justSubmitted:false }
  };

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function slug(){ return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function fmtDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' \u00b7 ' + d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  }

  async function loadProjects(){
    try{ const v = await storageGet('projects'); state.projects = v ? JSON.parse(v) : []; }
    catch(e){ console.error('load projects failed', e); state.projects = []; }
  }
  async function saveProjects(){
    try{ await storageSet('projects', JSON.stringify(state.projects)); showSaveBanner(true); return true; }
    catch(e){ console.error('save projects failed', e); window.__lastGhError = e.message; showSaveBanner(false); return false; }
  }
  async function loadRequests(projectId){
    try{ const v = await storageGet('requests:' + projectId); state.requests = v ? JSON.parse(v) : []; }
    catch(e){ console.error('load requests failed', e); state.requests = []; }
  }
  async function saveRequests(projectId){
    try{ await storageSet('requests:' + projectId, JSON.stringify(state.requests)); showSaveBanner(true); return true; }
    catch(e){ console.error('save requests failed', e); window.__lastGhError = e.message; showSaveBanner(false); return false; }
  }

  let bannerTimer = null;
  function showSaveBanner(success){
    let el = document.getElementById('saveBanner');
    if(!el){
      el = document.createElement('div');
      el.id = 'saveBanner';
      el.style.cssText = 'position:fixed;bottom:18px;right:18px;z-index:999;padding:10px 16px;border-radius:8px;font-size:12.5px;font-weight:600;font-family:Inter,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,0.4);transition:opacity .2s;';
      document.body.appendChild(el);
    }
    clearTimeout(bannerTimer);
    if(success){
      el.textContent = 'Saved';
      el.style.background = 'rgba(62,214,140,0.15)';
      el.style.color = '#3ED68C';
      el.style.border = '1px solid rgba(62,214,140,0.35)';
      el.style.opacity = '1';
      bannerTimer = setTimeout(()=>{ el.style.opacity = '0'; }, 1400);
    } else {
      el.innerHTML = 'Couldn\u2019t save to GitHub \u2014 ' + (window.__lastGhError || 'check your token, and that GITHUB_OWNER/GITHUB_REPO at the top of the file are correct.');
      el.style.maxWidth = '320px';
      el.style.lineHeight = '1.4';
      el.style.background = 'rgba(255,107,107,0.15)';
      el.style.color = '#FF6B6B';
      el.style.border = '1px solid rgba(255,107,107,0.35)';
      el.style.opacity = '1';
      // persistent — no auto-hide, so the user actually sees it
    }
  }

  function resetForm(){
    state.form = { reviewer:'', cats: freshCatState(), otherFeedback:'', justSubmitted:false };
  }

  function formIsValid(){
    const f = state.form;
    if(!f.reviewer.trim()) return false;
    for(const c of CATEGORIES){
      const cs = f.cats[c.id];
      if(!cs.yn) return false;
      if(cs.yn === 'no'){
        if(c.subj){
          // categories with both fields: at least one of the two is required
          if(!cs.objective.trim() && !cs.subjective.trim()) return false;
        } else {
          // objective-only categories still require the objective note
          if(!cs.objective.trim()) return false;
        }
      }
    }
    return true;
  }

  // ---------- Sidebar ----------
  function renderSidebar(){
    const list = document.getElementById('projectList');
    if(state.projects.length === 0){
      list.innerHTML = '<div class="empty-sidebar">No projects yet \u2014 add one below to start logging feedback.</div>';
      return;
    }
    list.innerHTML = state.projects.map(p => {
      const isRenaming = state.renamingProjectId === p.id;
      const isMenuOpen = state.openProjectMenuId === p.id;
      return `
      <li class="project-item ${p.id===state.currentProjectId?'active':''}" data-id="${p.id}">
        ${isRenaming
          ? `<input type="text" class="project-rename-input" id="renameInput_${p.id}" value="${escapeHtml(p.name)}" maxlength="60">`
          : `<span class="project-name">${escapeHtml(p.name)}</span>`
        }
        <button type="button" class="project-kebab" data-menu="${p.id}">\u22ee</button>
        ${isMenuOpen ? `
        <div class="project-menu" data-menu-panel="${p.id}">
          <button type="button" data-rename="${p.id}">Rename</button>
          <button type="button" class="danger" data-delete="${p.id}">Delete</button>
        </div>` : ''}
      </li>`;
    }).join('');

    list.querySelectorAll('.project-item').forEach(el=>{
      el.addEventListener('click', (e)=>{
        if(e.target.closest('.project-kebab') || e.target.closest('.project-menu') || e.target.closest('.project-rename-input')) return;
        selectProject(el.dataset.id);
      });
    });
    list.querySelectorAll('[data-menu]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        state.openProjectMenuId = state.openProjectMenuId === btn.dataset.menu ? null : btn.dataset.menu;
        renderSidebar();
      });
    });
    list.querySelectorAll('[data-rename]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        state.openProjectMenuId = null;
        state.renamingProjectId = btn.dataset.rename;
        renderSidebar();
        const input = document.getElementById('renameInput_' + btn.dataset.rename);
        if(input){ input.focus(); input.select(); }
      });
    });
    list.querySelectorAll('[data-delete]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        state.openProjectMenuId = null;
        deleteProject(btn.dataset.delete);
      });
    });
    list.querySelectorAll('.project-rename-input').forEach(input=>{
      input.addEventListener('click', e=>e.stopPropagation());
      input.addEventListener('keydown', e=>{
        if(e.key==='Enter') commitRename(input.id.replace('renameInput_',''), input.value);
        if(e.key==='Escape'){ state.renamingProjectId=null; renderSidebar(); }
      });
      input.addEventListener('blur', ()=>{
        const id = input.id.replace('renameInput_','');
        commitRename(id, input.value);
      });
    });
  }

  async function commitRename(id, rawValue){
    if(state.renamingProjectId !== id) return; // already committed
    const name = (rawValue||'').trim();
    const p = state.projects.find(x=>x.id===id);
    state.renamingProjectId = null;
    if(p && name){ p.name = name; await saveProjects(); }
    renderSidebar();
    renderMain();
  }

  async function deleteProject(id){
    const p = state.projects.find(x=>x.id===id);
    if(!p) return;
    const ok = window.confirm(`Delete "${p.name}"? This also deletes all feedback logged under this project. This can't be undone.`);
    if(!ok) return;
    state.projects = state.projects.filter(x=>x.id!==id);
    await saveProjects();
    try{ await storageDelete('requests:' + id); }catch(e){ /* ignore if nothing to delete */ }
    if(state.currentProjectId === id){
      if(state.projects.length > 0){
        await selectProject(state.projects[0].id);
      } else {
        state.currentProjectId = null;
        state.requests = [];
        render();
      }
    } else {
      renderSidebar();
    }
  }

  document.addEventListener('click', (e)=>{
    if(state.openProjectMenuId && !e.target.closest('.project-item')){
      state.openProjectMenuId = null;
      renderSidebar();
    }
  });

  // ---------- Main shell ----------
  function renderMain(){
    const main = document.getElementById('main');
    if(!state.currentProjectId){
      main.innerHTML = `<div class="no-project">
        <h2>Select or create a project</h2>
        <p>Feedback requests are organized by project \u2014 pick one on the left, or add a new one to get started.</p>
      </div>`;
      return;
    }
    const project = state.projects.find(p=>p.id===state.currentProjectId);
    main.innerHTML = `
      <div class="main-header">
        <div>
          <h1 class="project-title">${escapeHtml(project.name)}</h1>
          <div class="project-meta">${state.requests.length} request${state.requests.length===1?'':'s'} logged</div>
        </div>
        <div class="tabs">
          <button class="tab-btn ${state.view==='submit'?'active':''}" data-view="submit">Submit feedback</button>
          <button class="tab-btn ${state.view==='dashboard'?'active':''}" data-view="dashboard">Dashboard</button>
        </div>
      </div>
      <div id="viewArea"></div>
    `;
    document.querySelectorAll('.tab-btn').forEach(b=>{
      b.addEventListener('click', ()=>{ state.view = b.dataset.view; render(); });
    });
    if(state.view === 'submit') renderSubmitView();
    else renderDashboardView();
  }

  // ---------- Submit view ----------
  function renderSubmitView(){
    const f = state.form;
    const area = document.getElementById('viewArea');
    const reviewedCount = CATEGORIES.filter(c => f.cats[c.id].yn).length;
    const flaggedCount = CATEGORIES.filter(c => f.cats[c.id].yn === 'no').length;

    area.innerHTML = `
      <div class="card">
        <div class="field">
          <label>Reviewer name<span class="req">*</span></label>
          <input type="text" id="fReviewer" placeholder="Your name" value="${escapeHtml(f.reviewer)}">
        </div>

        <div class="field" style="margin-bottom:8px;">
          <div class="checklist-head">
            <label style="margin-bottom:0;">Per-category check<span class="req">*</span></label>
            <span class="checklist-progress">${reviewedCount}/${CATEGORIES.length} reviewed \u00b7 ${flaggedCount} flagged</span>
          </div>
          <div class="quick-actions">
            <button type="button" class="quick-btn" id="markAllYes">Mark all Yes</button>
            <button type="button" class="quick-btn" id="clearAll">Clear all</button>
          </div>
          <div class="cat-list">
            ${CATEGORIES.map(renderCatRow).join('')}
          </div>
          <div class="yn-help" style="font-size:12px;color:var(--text-dim);margin-top:8px;line-height:1.5;">
            Yes = meets the standard cited for that category, no action needed. No opens objective and subjective notes for that category \u2014 for most categories you only need to fill in one of the two (objective only for Aspect Ratio/Format and Legal/Compliance, which are always objective).
          </div>
        </div>

        <div class="field" style="margin-bottom:0;">
          <label>Other feedback <span style="font-weight:400;color:var(--text-dim);">(optional)</span></label>
          <textarea id="fOther" placeholder="Anything else worth flagging that doesn't fit a category above..." style="width:100%;min-height:80px;resize:vertical;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13.5px;line-height:1.5;">${escapeHtml(f.otherFeedback)}</textarea>
        </div>

        <div class="submit-row">
          <button class="btn-submit" id="submitBtn" ${formIsValid()?'':'disabled'}>Submit request</button>
          ${f.justSubmitted ? '<span class="submit-confirm">Saved to project log \u2713</span>' : '<span class="submit-note">Every category needs a Yes/No. Flagged categories need at least one note (objective or subjective) before you can submit.</span>'}
        </div>
      </div>
    `;

    document.getElementById('fOther').addEventListener('input', e=>{ f.otherFeedback=e.target.value; f.justSubmitted=false; });
    document.getElementById('fReviewer').addEventListener('input', e=>{ f.reviewer=e.target.value; f.justSubmitted=false; refreshSubmitBits(); });
    document.getElementById('markAllYes').addEventListener('click', ()=>{
      CATEGORIES.forEach(c => { f.cats[c.id].yn = 'yes'; f.cats[c.id].open = false; });
      f.justSubmitted=false; renderSubmitView();
    });
    document.getElementById('clearAll').addEventListener('click', ()=>{
      f.cats = freshCatState(); f.justSubmitted=false; renderSubmitView();
    });

    area.querySelectorAll('.cat-yn-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        const cid = b.dataset.cat, yn = b.dataset.yn;
        f.cats[cid].yn = yn;
        f.cats[cid].open = (yn === 'no');
        f.justSubmitted = false;
        renderSubmitView();
      });
    });
    area.querySelectorAll('.fb-tab').forEach(b=>{
      b.addEventListener('click', ()=>{
        f.cats[b.dataset.cat].fbTab = b.dataset.fbtab;
        renderSubmitView();
      });
    });
    area.querySelectorAll('.cat-obj-textarea').forEach(t=>{
      t.addEventListener('input', e=>{ f.cats[t.dataset.cat].objective = e.target.value; f.justSubmitted=false; refreshSubmitBits(); });
    });
    area.querySelectorAll('.cat-subj-textarea').forEach(t=>{
      t.addEventListener('input', e=>{ f.cats[t.dataset.cat].subjective = e.target.value; f.justSubmitted=false; refreshSubmitBits(); });
    });

    document.getElementById('submitBtn').addEventListener('click', submitRequest);
  }

  function renderCatRow(c){
    const f = state.form;
    const cs = f.cats[c.id];
    const flagged = cs.yn === 'no';
    let detail = '';
    if(flagged){
      if(c.subj){
        detail = `
          <div class="cat-detail">
            <div class="fb-tabs">
              <button type="button" class="fb-tab obj-tab ${cs.fbTab==='objective'?'active':''}" data-cat="${c.id}" data-fbtab="objective">Objective</button>
              <button type="button" class="fb-tab subj-tab ${cs.fbTab==='subjective'?'active':''}" data-cat="${c.id}" data-fbtab="subjective">Subjective</button>
            </div>
            <div class="fb-body ${cs.fbTab==='objective'?'obj-body':'subj-body'}">
              ${cs.fbTab==='objective' ? `
                <p class="fb-hint"><b>Objective, e.g.:</b> ${escapeHtml(c.obj)}</p>
                <textarea class="cat-obj-textarea" data-cat="${c.id}" placeholder="What specifically is wrong, and against what standard?">${escapeHtml(cs.objective)}</textarea>
              ` : `
                <p class="fb-hint"><b>Subjective, e.g.:</b> ${escapeHtml(c.subj)}</p>
                <textarea class="cat-subj-textarea" data-cat="${c.id}" placeholder="What's the creative preference here?">${escapeHtml(cs.subjective)}</textarea>
              `}
            </div>
          </div>`;
      } else {
        detail = `
          <div class="cat-detail">
            <div class="obj-only-body">
              <p class="fb-hint"><b>Always objective, e.g.:</b> ${escapeHtml(c.obj)}</p>
              <textarea class="cat-obj-textarea" data-cat="${c.id}" placeholder="What specifically is wrong, and against what standard?">${escapeHtml(cs.objective)}</textarea>
            </div>
          </div>`;
      }
    }
    return `
      <div class="cat-row ${flagged?'flagged':''}">
        <div class="cat-head">
          <div class="cat-name-wrap">
            <span class="cat-status-dot ${cs.yn||''}"></span>
            <span class="cat-name">${escapeHtml(c.name)}</span>
            ${!c.subj ? '<span class="cat-obj-only">Obj only</span>' : ''}
          </div>
          <div class="cat-yn">
            <button type="button" class="cat-yn-btn yes ${cs.yn==='yes'?'selected':''}" data-cat="${c.id}" data-yn="yes">Yes</button>
            <button type="button" class="cat-yn-btn no ${cs.yn==='no'?'selected':''}" data-cat="${c.id}" data-yn="no">No</button>
          </div>
        </div>
        ${detail}
      </div>
    `;
  }

  function refreshSubmitBits(){
    const btn = document.getElementById('submitBtn');
    if(btn) btn.disabled = !formIsValid();
    const noteSlot = document.querySelector('.submit-note, .submit-confirm');
    if(noteSlot){
      noteSlot.outerHTML = '<span class="submit-note">Every category needs a Yes/No. Flagged categories need at least one note (objective or subjective) before you can submit.</span>';
    }
    const progress = document.querySelector('.checklist-progress');
    if(progress){
      const reviewedCount = CATEGORIES.filter(c => state.form.cats[c.id].yn).length;
      const flaggedCount = CATEGORIES.filter(c => state.form.cats[c.id].yn === 'no').length;
      progress.textContent = `${reviewedCount}/${CATEGORIES.length} reviewed \u00b7 ${flaggedCount} flagged`;
    }
  }

  async function submitRequest(){
    const f = state.form;
    if(!formIsValid()) return;
    const categories = CATEGORIES.map(c => {
      const cs = f.cats[c.id];
      return {
        id: c.id, name: c.name, yn: cs.yn,
        objective: cs.yn==='no' ? cs.objective.trim() : '',
        subjective: (cs.yn==='no' && c.subj) ? cs.subjective.trim() : '',
        objOnly: !c.subj
      };
    });
    const req = {
      id: slug(),
      reviewer: f.reviewer.trim(),
      overall: categories.some(c => c.yn==='no') ? 'no' : 'yes',
      status: categories.some(c => c.yn==='no') ? 'action' : 'approved',
      flaggedCount: categories.filter(c=>c.yn==='no').length,
      categories,
      otherFeedback: f.otherFeedback.trim(),
      timestamp: new Date().toISOString()
    };
    state.requests.unshift(req);
    await saveRequests(state.currentProjectId);
    resetForm();
    state.form.justSubmitted = true;
    renderMain();
  }

  // ---------- Dashboard ----------
  function getStatus(r){ return r.status || (r.overall==='no' ? 'action' : 'approved'); }

  async function moveStatus(id, newStatus){
    const r = state.requests.find(x=>x.id===id);
    if(!r || getStatus(r)===newStatus) return;
    r.status = newStatus;
    await saveRequests(state.currentProjectId);
    renderDashboardView();
  }

  function renderDashboardView(){
    const area = document.getElementById('viewArea');
    const approved = state.requests.filter(r=>getStatus(r)==='approved');
    const action = state.requests.filter(r=>getStatus(r)==='action');

    if(state.requests.length===0){
      area.innerHTML = `<div class="empty-dash">
        <h3>Nothing here yet</h3>
        <p>Submitted feedback for this project will show up on the board below.</p>
      </div>`;
      return;
    }

    area.innerHTML = `
      <div class="kanban">
        <div class="kanban-col" data-status="approved">
          <div class="kanban-col-head">
            <span class="kanban-dot approved"></span>
            <span class="kanban-title">Approved</span>
            <span class="kanban-count">${approved.length}</span>
          </div>
          <div class="kanban-cards">
            ${approved.length ? approved.map(r=>renderReqCard(r,'approved')).join('') : '<div class="kanban-empty">Drag a request here to mark it Approved.</div>'}
          </div>
        </div>
        <div class="kanban-col" data-status="action">
          <div class="kanban-col-head">
            <span class="kanban-dot action"></span>
            <span class="kanban-title">Action</span>
            <span class="kanban-count">${action.length}</span>
          </div>
          <div class="kanban-cards">
            ${action.length ? action.map(r=>renderReqCard(r,'action')).join('') : '<div class="kanban-empty">Drag a request here to send it back to Action.</div>'}
          </div>
        </div>
      </div>
    `;

    // Expand/collapse (ignore clicks on the move button)
    area.querySelectorAll('.req-row').forEach(row=>{
      row.addEventListener('click', (e)=>{
        if(e.target.closest('.status-move-btn')) return;
        row.closest('.req-card').classList.toggle('open');
      });
    });
    // Manual status toggle button
    area.querySelectorAll('.status-move-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        moveStatus(btn.dataset.id, btn.dataset.target);
      });
    });
    // Drag handlers on cards
    area.querySelectorAll('.req-card').forEach(card=>{
      card.addEventListener('dragstart', e=>{
        e.dataTransfer.setData('text/plain', card.dataset.id);
        e.dataTransfer.effectAllowed = 'move';
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', ()=>{ card.classList.remove('dragging'); });
    });
    // Drop handlers on columns
    area.querySelectorAll('.kanban-col').forEach(col=>{
      col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('drag-over'); });
      col.addEventListener('dragleave', ()=>{ col.classList.remove('drag-over'); });
      col.addEventListener('drop', e=>{
        e.preventDefault();
        col.classList.remove('drag-over');
        const id = e.dataTransfer.getData('text/plain');
        moveStatus(id, col.dataset.status);
      });
    });
  }

  function renderReqCard(r, columnStatus){
    const flagged = (r.categories||[]).filter(c=>c.yn==='no');
    const targetStatus = columnStatus === 'approved' ? 'action' : 'approved';
    const moveLabel = columnStatus === 'approved' ? '\u2192 Action' : '\u2192 Approved';
    return `
      <div class="req-card" data-id="${r.id}" draggable="true">
        <div class="req-row">
          <span class="badge ${columnStatus}">${columnStatus}</span>
          <div class="req-info">
            <div class="req-title">${escapeHtml(r.reviewer)}</div>
            <div class="req-sub">${fmtDate(r.timestamp)} \u00b7 ${flagged.length} of ${(r.categories||[]).length} flagged</div>
          </div>
          <button type="button" class="status-move-btn" data-id="${r.id}" data-target="${targetStatus}">${moveLabel}</button>
          <span class="chevron">\u25b8</span>
        </div>
        <div class="req-detail">
          ${flagged.length===0 ? `<div class="all-clear">All categories met standard \u2014 no notes logged.</div>` : `
          <div class="flagged-cats">
            ${flagged.map(c => `
              <div class="flagged-cat-block">
                <div class="flagged-cat-title"><span class="cat-status-dot"></span>${escapeHtml(c.name)}</div>
                <div class="detail-grid ${c.objOnly?'single':''}">
                  <div class="detail-panel obj">
                    <span class="detail-panel-label">Objective</span>
                    ${escapeHtml(c.objective) || '<em style="color:var(--text-dim)">No details given</em>'}
                  </div>
                  ${c.objOnly ? '' : `
                  <div class="detail-panel subj">
                    <span class="detail-panel-label">Subjective</span>
                    ${escapeHtml(c.subjective) || '<em style="color:var(--text-dim)">No details given</em>'}
                  </div>`}
                </div>
              </div>
            `).join('')}
          </div>`}
          ${r.otherFeedback ? `
          <div class="flagged-cat-block" style="margin-top:14px;">
            <div class="flagged-cat-title" style="background:var(--bg-card-hover);"><span class="cat-status-dot" style="background:var(--text-dim);"></span>Other feedback</div>
            <div class="detail-panel" style="background:var(--bg-elevated);">${escapeHtml(r.otherFeedback)}</div>
          </div>` : ''}
        </div>
      </div>
    `;
  }

  async function selectProject(id){
    state.currentProjectId = id;
    state.view = 'submit';
    resetForm();
    await loadRequests(id);
    render();
  }

  function render(){ renderSidebar(); renderMain(); }

  document.getElementById('toggleNewProject').addEventListener('click', ()=>{
    const f = document.getElementById('newProjectForm');
    f.classList.toggle('open');
    if(f.classList.contains('open')) document.getElementById('newProjectInput').focus();
  });
  document.getElementById('confirmNewProject').addEventListener('click', addProject);
  document.getElementById('newProjectInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addProject(); });
  async function addProject(){
    const input = document.getElementById('newProjectInput');
    const name = input.value.trim();
    if(!name) return;
    const p = {id: slug(), name, createdAt: new Date().toISOString()};
    state.projects.push(p);
    await saveProjects();
    input.value = '';
    document.getElementById('newProjectForm').classList.remove('open');
    await selectProject(p.id);
  }

  (async function init(){
    await loadProjects();
    if(state.projects.length > 0) await selectProject(state.projects[0].id);
    else render();
  })();
})();
</script>
